<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clases </title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/table.css">

</head>

<body>

  <div class="scroll-watcher"></div>

  <header>
    <img class="logo-header" src="img/logo/WoW_icon.svg" alt="Logo de World of Warcraft">
    <h1>Formulario de incidencias</h1>
  </header>

  <div class="form-assist">
    <h1>Asistencia para jugadores</h1>
    <form id="assistForm">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" name="name" id="name">
        <small class="error-message"></small>
      </div>
      <div class="form-group">
        <label for="surnames">Apellidos</label>
        <input type="text" name="surnames" id="surnames">
        <small class="error-message"></small>
      </div>
      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input type="number" name="phone" id="phone">
        <small class="error-message"></small>
      </div>
      <div class="form-group">
        <label for="email">Correo</label>
        <input type="text" name="email" id="email">
        <small class="error-message"></small>
      </div>
      <div class="form-group">
        <label for="incident">Incidencia</label>
        <input type="text" name="incident" id="incident">
        <small class="error-message"></small>
      </div>
      <div class="form-group">
        <label for="urgent">¿Urgente?</label>
        <input type="checkbox" name="urgent" id="urgent">
        <small class="error-message"></small>
      </div>
      <button type="submit">Guardar</button>
      <button type="button" class="btn primary" onclick="goHomepage()">Volver</button>
    </form>
  </div>

  <footer>
    <img class="logo-footer" src="img/logo/blizz_blue_logo.png" alt="Logo de Blizzard">
    <p>Inspirado en <a href="https://dribbble.com/shots/24659454-Customer-Journey-CRM-Dashboard">esta pagina </a>
      <i class="fa fa-trademark"></i>
      Pagina web creada por Kailancito el Gnomo
      <i class="fa fa-copyright"></i>
    </p>
  </footer>

  <script src="js/script.js"></script>
  <script src="js/form-assist.js"></script>

</body>

</html>
